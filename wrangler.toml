name = "aaronbassett-md"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Without this the static-asset layer answers before the Worker ever runs, and
# GET / would always return index.html — content negotiation would be silently
# bypassed. This single line is load-bearing.
run_worker_first = true

# The custom domain is attached once, by hand, in the Cloudflare dashboard;
# see "Cloudflare setup" in README.md. Uncommenting this would make every
# deploy claim the route instead.
#
# [[routes]]
# pattern = "aaronbassett.md"
# custom_domain = true
